services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homesplit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homesplit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for attachments. Buckets are created on the
  # first upload.
  object-storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: server -s3 -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: homesplit
      AWS_SECRET_ACCESS_KEY: homesplit-dev-secret
    ports:
      - "8333:8333"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Throwaway database for backend tests: separate port, data in memory only.
  postgres-test:
    image: postgres:18-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homesplit_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homesplit_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
  object-storage-data:
