name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Run lint
        run: pnpm lint

  typecheck:
    name: typecheck (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, contracts, web]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Build workspace dependencies
        run: pnpm --filter "${{ matrix.package }}^..." build

      - name: Run typecheck
        run: pnpm --filter ${{ matrix.package }} typecheck
        env:
          # `next typegen` evaluates the web rewrites, which need an API origin.
          API_URL: http://localhost:8080

  build:
    name: build (${{ matrix.package }})
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, contracts, web]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Build workspace dependencies
        run: pnpm --filter "${{ matrix.package }}^..." build

      - name: Run build
        run: pnpm --filter ${{ matrix.package }} build
        env:
          API_URL: http://localhost:8080

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, contracts, web]
    services:
      postgres-test:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homesplit_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homesplit_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Build workspace dependencies
        run: pnpm --filter "${{ matrix.package }}^..." build

      - name: Run tests
        run: pnpm --filter ${{ matrix.package }} test

  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pull requests run the end-to-end tests only when they touch what the
      # tests exercise; pushes to main always run them.
      - name: Find changed packages
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed() {
            [ "$EVENT" != pull_request ] || ! git diff --quiet "$BASE...$HEAD" -- "$@"
          }
          shared=(packages/contracts package.json pnpm-lock.yaml pnpm-workspace.yaml .github/workflows/ci.yml)
          if changed packages/web "${shared[@]}"; then web=true; else web=false; fi
          if changed packages/web packages/backend "${shared[@]}"; then stack=true; else stack=false; fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "stack=$stack" >> "$GITHUB_OUTPUT"

  e2e-web:
    name: e2e (web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Build workspace dependencies
        run: pnpm --filter "web^..." build

      - name: Install Playwright's Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run end-to-end tests against the mocks
        run: pnpm --filter web e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-mocks
          path: |
            packages/web/playwright-report/
            packages/web/test-results/
          retention-days: 7

  e2e-web-backend:
    name: e2e (web, backend)
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homesplit_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homesplit_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Build workspace dependencies
        run: pnpm --filter "web^..." --filter "backend^..." build

      - name: Install Playwright's Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run end-to-end tests against the backend
        run: pnpm --filter web e2e:backend

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-backend
          path: |
            packages/web/playwright-report/
            packages/web/test-results/
          retention-days: 7

  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Validate pushed commits with commitlint
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            pnpm exec commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            pnpm exec commitlint --last --verbose
          fi

      - name: Validate pull request commits with commitlint
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose

      - name: Validate pull request title with commitlint
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        # Fetch the current title: re-runs replay the original event payload, so its title may be stale.
        run: |
          TITLE=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          echo "$TITLE (#$NUMBER)" | pnpm exec commitlint --verbose
