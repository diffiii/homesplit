name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Run lint
        run: pnpm lint

  typecheck:
    name: typecheck (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Run typecheck
        run: pnpm --filter ${{ matrix.package }} typecheck

  build:
    name: build (${{ matrix.package }})
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Run build
        run: pnpm --filter ${{ matrix.package }} build

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Validate pushed commits with commitlint
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            pnpm exec commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            pnpm exec commitlint --last --verbose
          fi

      - name: Validate pull request commits with commitlint
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose
