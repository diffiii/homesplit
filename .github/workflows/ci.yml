name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Run lint
        run: pnpm lint

  typecheck:
    name: typecheck (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, contracts]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Build workspace dependencies
        run: pnpm --filter "${{ matrix.package }}^..." build

      - name: Run typecheck
        run: pnpm --filter ${{ matrix.package }} typecheck

  build:
    name: build (${{ matrix.package }})
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, contracts]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Build workspace dependencies
        run: pnpm --filter "${{ matrix.package }}^..." build

      - name: Run build
        run: pnpm --filter ${{ matrix.package }} build

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend]
    services:
      postgres-test:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homesplit_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homesplit_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Build workspace dependencies
        run: pnpm --filter "${{ matrix.package }}^..." build

      - name: Run tests
        run: pnpm --filter ${{ matrix.package }} test

  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@lts

      - name: Validate pushed commits with commitlint
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            pnpm exec commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            pnpm exec commitlint --last --verbose
          fi

      - name: Validate pull request commits with commitlint
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose

      - name: Validate pull request title with commitlint
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        # Fetch the current title: re-runs replay the original event payload, so its title may be stale.
        run: |
          TITLE=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          echo "$TITLE (#$NUMBER)" | pnpm exec commitlint --verbose
